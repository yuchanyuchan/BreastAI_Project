services:
  - type: web
    name: breastai-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    numInstances: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: DATABASE_URL
        fromDatabase:
          name: breastai-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBMED_API_KEY
        sync: false
      - key: SNS_TIMEZONE
        value: Asia/Tokyo
      - key: SNS_GENERATE_HOUR
        value: "7"
      - key: SNS_PUBLISH_INTERVAL_MINUTES
        value: "30"
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_HASHTAGS_DOCTOR
        sync: false
      - key: INSTAGRAM_HASHTAGS_BEAUTY
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false

databases:
  - name: breastai-db
    plan: starter
